<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DE MI PARA TI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            /* Cielo nocturno muy oscuro */
            background: #05070a;
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Lluvia de estrellas doradas */
        .stars-rain {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star-gold {
            position: absolute;
            background: gold;
            width: 2px; height: 2px;
            border-radius: 50%;
            box-shadow: 0 0 5px gold;
            animation: rain linear infinite;
        }
        @keyframes rain {
            from { transform: translateY(-10px); opacity: 1; }
            to { transform: translateY(100vh); opacity: 0; }
        }

        /* La tarjeta con fondo azul bonito */
        .container {
            background: linear-gradient(160deg, rgba(10, 25, 47, 0.9) 0%, rgba(2, 12, 27, 0.95) 100%);
            border: 1px solid rgba(100, 255, 218, 0.2);
            backdrop-filter: blur(15px);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            z-index: 1;
            position: relative;
        }

        .photo-frame-wrapper {
            position: relative;
            width: 200px; height: 200px;
            margin: 0 auto 30px auto;
            border-radius: 20px;
            padding: 3px;
            overflow: hidden;
        }
        .photo-frame-wrapper::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(transparent, #ff007f, transparent, #ff007f);
            animation: rotate 3s linear infinite;
        }
        @keyframes rotate { 100% { transform: rotate(360deg); } }

        .photo-inner {
            position: relative; z-index: 1; width: 100%; height: 100%;
            background: #0a192f; border-radius: 17px; overflow: hidden;
        }
        .photo-inner img { width: 100%; height: 100%; object-fit: cover; }

        h1 { font-size: 2.2rem; margin-bottom: 10px; color: #64ffda; }
        .message { font-size: 1rem; color: #8892b0; line-height: 1.7; margin-bottom: 30px; }
        
        .love-btn {
            background: transparent; color: #64ffda; border: 1px solid #64ffda;
            padding: 10px 20px; border-radius: 8px; margin: 5px; cursor: pointer; transition: 0.3s;
        }
        .love-btn:hover { background: rgba(100, 255, 218, 0.1); }

        .signature { margin-top: 30px; font-weight: 600; color: #ff007f; }
    </style>
</head>
<body>

    <div class="stars-rain" id="stars-container"></div>

    <div class="container">
        <div class="photo-frame-wrapper">
            <div class="photo-inner"><img src="nosotros.jpg" alt="Amor"></div>
        </div>

        <h1>Nuestra Serendipia</h1>
        <p class="message">
            El azul más profundo es el que guardo para ti, y estas estrellas doradas son solo un pequeño reflejo de todo lo que iluminas mi vida.
        </p>

        <div>
            <button class="love-btn" onclick="location.href='flores.html'">🌸 Flores</button>
            <button class="love-btn" onclick="location.href='arboles.html'">🌲 Árboles</button>
        </div>

        <div class="signature">Te amo con toda el alma ✨</div>
    </div>

    <script>
        // Generar lluvia de estrellas doradas
        const container = document.getElementById('stars-container');
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'star-gold';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.animationDuration = (Math.random() * 3 + 2) + 's';
            star.style.animationDelay = Math.random() * 5 + 's';
            container.appendChild(star);
        }
    </script>
</body>
</html>
